services:
  - type: web
    name: sparkle-hub-billing
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Only needed if a custom domain sits in front of this service; the
      # service's own onrender.com URL is allow-listed automatically.
      - key: CORS_ORIGIN
        sync: false
