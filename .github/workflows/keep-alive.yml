name: Keep Render Server Alive

on:
  schedule:
    # Every 10 minutes — Render's free tier spins down after ~15 minutes idle
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: |
          curl -sf --max-time 30 https://sparkle-hub-billing.onrender.com/ \
            && echo "Server is awake" \
            || echo "Ping failed (server may still be waking up from a cold start)"
